<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：iPad 全面屏下延伸到安全区，配合 env(safe-area-inset-*) 使用 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#7B3FE4" />
    <meta name="description" content="英语 / 思维 / 百科 / 识字 —— 小朋友的学习工作台" />

    <!-- 图标：SVG 优先（任意缩放都清晰），ICO 与 PNG 作为兜底 -->
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
    <!-- iOS 添加到主屏：必须是满幅方角，圆角由系统自己裁 -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- 添加到主屏后以独立应用方式启动（无浏览器工具栏），横屏体验最佳 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="学习工作台" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <title>学习工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
