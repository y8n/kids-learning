# 构建并发布到 GitHub Pages
#
# 构建在远端 Runner 上完成，**仓库里不提交任何构建产物**。
# 之前是直接发布仓库里的 ./build 目录，现在改成 Job 内 npm ci && npm run build。
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，但不打断正在进行的生产部署
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # 注入「本次工作流触发时刻」。vite.config.ts 读取后写进产物，
          # 首页右下角点击版本号会显示这个时间。
          # 不注入则会退回构建机器上的当前时刻，本地开发够用，CI 上不够准。
          BUILD_TIME: ${{ github.run_started_at }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
