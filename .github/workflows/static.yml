# 构建并发布到 GitHub Pages
#
# 构建在远端 Runner 上完成，**仓库里不提交任何构建产物**。
# 之前是直接发布仓库里的 ./build 目录，现在改成 Job 内 npm ci && npm run build。
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，但不打断正在进行的生产部署
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 注入「本次构建时刻」。不能用 `env: BUILD_TIME: ${{ github.run_started_at }}` ——
      # 实测该表达式在这里会取到空串，产物里就成了「v0.1.0发布于」这种残句。
      # 写成 GITHUB_ENV 更稳，后续步骤都能读到。
      - name: Stamp build time
        run: |
          STAMP="${{ github.run_started_at }}"
          [ -n "$STAMP" ] || STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "BUILD_TIME=$STAMP" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$STAMP"

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
