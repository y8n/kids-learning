# 构建并发布到 GitHub Pages
#
# 构建在远端 Runner 上完成，**仓库里不提交任何构建产物**。
# 之前是直接发布仓库里的 ./build 目录，现在改成 Job 内 npm ci && npm run build。
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
    # 只改这些文件时不跑部署。
    #
    # 为什么要在意：CI 跑一次就会产出新的 BUILD_TIME（来自 run_started_at），
    # 前台挂着的 PWA 检测到「有新版本」会自己 reload ——
    # 只改了 README 却让小孩 iPad 上的应用刷一下，是没必要的干扰。
    #
    # ⚠️ 只有**整次推送全是**这些文件时才跳过；
    #    混了 src/ 之类的改动照样会跑（这正是想要的）。
    # ⚠️ 不要往里加 .github/** —— 改了 workflow 本身必须跑一次来验证它。
    paths-ignore:
      # 文档：不参与构建
      - '**.md' # AGENTS.md / README.md / CHANGELOG.md
      - 'LICENSE'
      # 本地开发 / 编辑器配置：CI 只跑 typecheck + lint + build，都不读这些
      # （CI 不跑 prettier，所以 .prettierrc / .prettierignore / .editorconfig 可忽略）
      - '.editorconfig'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.gitignore'
      - '.vscode/**'
      - '.idea/**'
      # 归档的原始立绘：src 里没有任何引用，不进构建产物
      - 'assets/characters-source/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，但不打断正在进行的生产部署
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 注入「本次构建时刻」。不能用 `env: BUILD_TIME: ${{ github.run_started_at }}` ——
      # 实测该表达式在这里会取到空串，产物里就成了「v0.1.0发布于」这种残句。
      # 写成 GITHUB_ENV 更稳，后续步骤都能读到。
      - name: Stamp build time
        run: |
          STAMP="${{ github.run_started_at }}"
          [ -n "$STAMP" ] || STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "BUILD_TIME=$STAMP" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$STAMP"

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
